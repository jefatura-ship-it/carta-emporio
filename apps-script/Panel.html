<!DOCTYPE html>
<html lang="es">
<head>
<base target="_blank">
<meta charset="utf-8">
<title>SabAPP</title>
<style>
:root{--campo:#1f5f3a;--campo-2:#2d7a4d;--sol:#e8761a;--sol-2:#fde3cf;--papel:#f6f2e9;--tarjeta:#fff;--tinta:#1c1c1a;--suave:#66645c;--linea:#e2dccd;--rojo:#b3261e;--azul:#2357a8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
.barra{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;background:var(--campo);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.marca{display:flex;align-items:center;gap:14px;margin-right:auto}
.marca img{display:block;height:40px;width:auto}
.marca b{padding-left:14px;border-left:1px solid rgba(255,255,255,.35);font-size:20px;letter-spacing:.01em}
.vivo{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;opacity:.95}
.vivo i{width:10px;height:10px;border-radius:50%;background:#7be08f;box-shadow:0 0 0 0 rgba(123,224,143,.7);animation:pulso 2s infinite}
.vivo.error i{background:#ff8a7a;animation:none}
@keyframes pulso{70%{box-shadow:0 0 0 8px rgba(123,224,143,0)}100%{box-shadow:0 0 0 0 rgba(123,224,143,0)}}
.sonido{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border:1.5px solid rgba(255,255,255,.7);border-radius:999px;background:transparent;color:#fff;font-weight:700;font-size:13.5px}
.sonido.on{background:#fff;color:var(--campo);border-color:#fff}
.usuario{font-size:12.5px;opacity:.8}
.herr{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 20px 4px}
.chip{min-height:38px;padding:6px 16px;border:1.5px solid var(--linea);border-radius:999px;background:#fff;color:var(--tinta);font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.chip small{font-weight:800;margin-left:4px;opacity:.75}
.busca{flex:1 1 260px;max-width:420px;margin-left:auto;position:relative}
.busca input{width:100%;min-height:40px;padding:8px 14px 8px 38px;border:1.5px solid var(--linea);border-radius:12px;background:#fff;font:inherit}
.busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--suave)}
.cuerpo{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding:12px 20px 40px}
@media (min-width:1280px){.cuerpo:has(.lado){grid-template-columns:minmax(0,1fr) 300px}}
.tablero{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:6px}
.col{background:#ece6d8;border-radius:16px;padding:10px;min-height:120px}
.col h2{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 10px;font-size:15px}
.plegar{display:flex;align-items:center;gap:6px;flex:1;min-width:0;padding:0;border:0;background:none;color:inherit;font:inherit;font-weight:800;text-align:left;cursor:pointer}
.plegar .flecha{display:inline-block;width:14px;font-size:15px;line-height:1;transition:transform .2s}
.plegada .plegar .flecha{transform:rotate(-90deg)}
.col.plegada{min-height:0;padding-bottom:2px}
.col.plegada>.ped,.col.plegada>.vacio,.caja.plegada>:not(h3){display:none}
.caja h3{display:flex}
.col h2>span.hay-nuevo{background:var(--sol);color:#fff;animation:pulso 1.6s infinite}
/* Una página por estado (19/11/2026): pestañas arriba y las tarjetas en grilla a todo el ancho */
.pestanas{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.pest{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border:1.5px solid var(--linea);border-radius:14px;background:#fff;color:var(--tinta);font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.pest>span{min-width:28px;height:24px;padding:0 8px;border-radius:999px;background:#ece6d8;font-size:13px;line-height:24px;text-align:center}
.pest[aria-selected="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.pest[aria-selected="true"]>span{background:#fff;color:var(--tinta)}
.pest.p-pc>span{background:var(--sol);color:#fff}
.pest>span.hay-nuevo{background:var(--sol);color:#fff;animation:pulso 1.6s infinite}
.principal{min-width:0}
.tablero.una{display:block;overflow:visible}
.col.una h2{justify-content:flex-start;gap:10px;flex-wrap:wrap}
.col.una h2 small{font-weight:600;font-size:12.5px;color:var(--suave)}
.col.una .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.col.una .lista .ped{margin-bottom:0}
@media (min-width:1101px){
  .tablero{grid-template-columns:var(--cols,repeat(4,minmax(240px,1fr)))}
  .col.plegada h2{flex-direction:column;gap:10px;margin:4px 0}
  .col.plegada .plegar{writing-mode:vertical-rl;flex:none}
  .col.plegada .plegar .flecha{transform:none}
}
.b.correo{background:#e9f0fb;border-color:#c5d6f2;color:#1d4f9a}
.col h2>span{min-width:28px;height:24px;padding:0 8px;border-radius:999px;background:#fff;font-size:13px;line-height:24px;text-align:center}
.col.c-pc h2{color:#8a3a00}.col.c-pc h2>span{background:var(--sol);color:#fff}
.col.c-co h2{color:var(--campo)}
.col.c-pr h2{color:var(--azul)}
.col.c-ce h2{color:var(--suave)}
.vacio{margin:6px 4px 10px;color:var(--suave);font-size:13.5px}
.ped{position:relative;margin-bottom:10px;padding:12px 12px 10px;border-radius:14px;background:var(--tarjeta);box-shadow:0 1px 2px rgba(0,0,0,.08);border:1.5px solid transparent}
.ped.alta{border-color:#f0b8b2}
.ped.nuevo{border-color:var(--sol);box-shadow:0 0 0 3px rgba(232,118,26,.25);animation:llega 1.2s ease-out 3}
@keyframes llega{0%{transform:scale(1)}20%{transform:scale(1.02)}40%{transform:scale(1)}}
.ped.cerrado{opacity:.72}
.p-cab{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.p-cod{font-weight:800;font-size:13px;color:var(--suave);letter-spacing:.02em}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.t-nuevo{background:var(--sol);color:#fff}
.t-alta{background:#fbe1de;color:var(--rojo)}
.t-frec{background:#dff0e5;color:var(--campo)}
.t-hoy{background:#fff2c2;color:#7a5b00}
.t-man{background:#e3f1dc;color:var(--campo)}
.t-atr{background:#eeeeee;color:var(--suave)}
.p-cli{font-size:17px;font-weight:800;line-height:1.25}
.p-cel{color:var(--suave);font-size:13.5px}
.p-ret{display:flex;align-items:center;gap:8px;margin:8px 0;padding:7px 10px;border-radius:10px;background:var(--papel);font-weight:700;font-size:14px}
.p-items{margin:6px 0;padding:0;list-style:none;font-size:14px}
.p-items li{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--linea)}
.p-items li:last-child{border-bottom:0}
.p-items b{min-width:28px;text-align:right}
.p-sku{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--papel);color:var(--suave);font-size:11.5px;font-weight:800;letter-spacing:.03em;white-space:nowrap;vertical-align:1px}
.p-mayor{margin-top:8px;padding:6px 10px;border-radius:8px;background:#fff4e5;color:#9a3412;font-size:13px;font-weight:700}
.p-mayor.repite{background:#fdecea;color:#9b1c1c;border:1.5px solid #f0b8b2}
.p-avisado{display:flex;align-items:center;gap:6px;margin-top:8px;padding:6px 10px;border-radius:8px;background:#e6f6ec;color:#14663a;font-size:13px;font-weight:700}
.caja li small{display:block;color:var(--suave);font-size:11.5px;font-weight:700;letter-spacing:.03em}
.p-mas{border:0;background:none;color:var(--azul);font-weight:700;font-size:13px;padding:2px 0}
.p-nota{margin:6px 0;padding:6px 10px;border-radius:8px;background:#fff7d6;font-size:13.5px}
.p-pie{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px;margin-top:6px;font-size:13px;color:var(--suave)}
.p-pie span{white-space:nowrap}
.p-pie strong{font-size:16px;color:var(--tinta)}
.p-pie .p-neto{flex-basis:100%;text-align:right}.p-pie .p-neto strong{font-size:14px}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--linea);background:#fff;color:var(--tinta);font-weight:700;font-size:13.5px;text-decoration:none}
.b:disabled{opacity:.5;cursor:default}
.b.prim{flex:1 1 auto;background:var(--campo);border-color:var(--campo);color:#fff}
.b.prim.azul{background:var(--azul);border-color:var(--azul)}
.b.wsp{background:#e6f6ec;border-color:#bfe3cc;color:#14663a}
.b.peq{min-height:32px;padding:4px 10px;font-size:12.5px;color:var(--suave)}
.b.peligro{color:var(--rojo)}
.b.seguro{background:var(--rojo);border-color:var(--rojo);color:#fff}
.lado{display:grid;gap:14px;align-content:start}
.caja{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.caja h3{margin:0 0 8px;font-size:15px}
.caja h4{margin:10px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave)}
.caja ul{margin:0;padding:0;list-style:none;font-size:14px}
.caja li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--papel)}
.caja li b{white-space:nowrap}
.caja p{margin:0;color:var(--suave);font-size:13.5px}
.aviso{position:fixed;right:20px;bottom:20px;z-index:9;display:none;max-width:360px;padding:14px 16px;border-radius:14px;background:var(--tinta);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:700}
.aviso.ver{display:block;animation:sube .3s ease-out}
@keyframes sube{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.cargando{padding:40px;text-align:center;color:var(--suave)}
.sinacceso{max-width:520px;margin:60px auto;padding:24px;border-radius:16px;background:#fff;text-align:center}
.p-prep{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:32px;margin:0 0 6px;padding:4px 12px;border-radius:999px;border:1.5px solid #bfe3cc;background:#e6f6ec;color:#14663a;font-weight:800;font-size:13.5px;text-align:left}
.p-prep u{margin-left:2px;color:var(--suave);font-size:12px;font-weight:700}
.p-prep.falta{border-style:dashed;border-color:var(--sol);background:#fff;color:#8a3a00}
.p-prep.fijo{cursor:default}
.p-prep:disabled{opacity:.6}
.t-local{background:var(--rojo);color:#fff}
.p-ret.local{background:#fbe1de;color:var(--rojo)}
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(28,28,26,.5)}
.modal[hidden]{display:none}
.dlg{width:100%;max-width:500px;max-height:calc(100vh - 40px);overflow:auto;padding:22px 22px 18px;border-radius:18px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:sube .2s ease-out}
.dlg h2{margin:0 0 4px;font-size:21px}
.dlg p{margin:0 0 16px;color:var(--suave);font-size:14px}
.vend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vend button{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 12px;border:1.5px solid var(--linea);border-radius:12px;background:var(--papel);color:var(--tinta);font-weight:800;font-size:16px;text-align:left}
.vend button:hover,.vend button:focus-visible{border-color:var(--campo);background:#e6f6ec;outline:none}
.vend button.ult{border-color:var(--campo);box-shadow:inset 0 0 0 1px var(--campo)}
.vend button.actual{border-color:var(--campo);background:var(--campo);color:#fff}
.vend i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--campo);color:#fff;font-style:normal;font-size:13px;line-height:34px;text-align:center;letter-spacing:.02em}
.vend button.actual i{background:#fff;color:var(--campo)}
.vend small{margin-left:auto;font-size:11.5px;font-weight:700;opacity:.85}
.m-pie{display:flex;justify-content:flex-end;margin-top:16px}
@media (max-width:480px){.vend small{display:none}}
.salir{min-height:36px;padding:6px 14px;border:1.5px solid rgba(255,255,255,.7);border-radius:999px;background:transparent;color:#fff;font-weight:700;font-size:13.5px}
.salir[hidden]{display:none}
.ingreso{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--papel)}
.ingreso[hidden]{display:none}
.ing-caja{width:100%;max-width:380px;display:grid;gap:12px;padding:28px 24px 24px;border-radius:20px;background:#fff;box-shadow:0 18px 40px -20px rgba(0,0,0,.35);text-align:left}
.ing-caja img{justify-self:center}
.ing-caja h1{margin:0;text-align:center;font-size:28px;color:var(--campo)}
.ing-caja p{margin:0;text-align:center;color:var(--suave);font-size:14px}
.ing-caja label{display:grid;gap:4px;font-weight:700;font-size:13.5px;color:#4a483f}
.ing-caja input[type=email],.ing-caja input[type=password],.ing-caja input[type=text]{min-height:46px;padding:8px 12px;border:1.5px solid var(--linea);border-radius:12px;font:inherit;font-size:16px}
.ing-caja .ver{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--suave)}
.ing-msg{min-height:1.3em;margin:0;color:var(--rojo)!important;font-weight:700}
.ing-caja .b{min-height:48px;font-size:16px}
.ing-caja label[hidden],.ing-caja .b[hidden]{display:none}
.admin{position:fixed;inset:0;z-index:25;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;background:rgba(28,28,26,.5)}
.admin[hidden]{display:none}
.adm-caja{width:100%;max-width:680px;padding:20px 22px 22px;border-radius:18px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.adm-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.adm-cab h2{margin:0;font-size:21px;color:var(--campo)}
.adm-caja h3{margin:18px 0 8px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.adm-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border:1px solid var(--linea);border-radius:12px;background:var(--papel)}
.adm-form label{display:grid;gap:3px;font-weight:700;font-size:13px;color:#4a483f}
.adm-form input:not([type=checkbox]){min-height:40px;padding:6px 10px;border:1.5px solid var(--linea);border-radius:10px;font:inherit;font-size:15px;background:#fff}
.adm-form .ver{display:flex;align-items:center;gap:8px;font-weight:600}
.adm-form .ancho{grid-column:1/-1}
.adm-bts{display:flex;gap:8px;grid-column:1/-1}
.adm-msg{min-height:1.3em;margin:8px 0 0;font-weight:700;color:var(--campo)}
.adm-msg.mal{color:var(--rojo)}
.adm-lista,.adm-sis{margin:0;padding:0;list-style:none}
.adm-lista li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--linea)}
.adm-lista li>div{flex:1 1 220px;min-width:0}
.adm-lista b{display:block}
.adm-lista small{color:var(--suave)}
.adm-et{display:inline-block;margin-left:6px;padding:0 8px;border-radius:999px;background:#e6f6ec;color:#14663a;font-size:11.5px;font-weight:800}
.adm-sis li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--papel);font-size:14px}
.adm-sis li span{color:var(--suave)}
@media (max-width:560px){.adm-form{grid-template-columns:1fr}}
/* Stock bajo (18/11/2026) */
.stock{margin:0 0 14px;padding:12px 14px;border:2px solid var(--rojo);border-radius:14px;background:#fff7f6}
.stock h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px;font-size:16px;color:var(--rojo)}
.stock h2 small{font-size:12.5px;font-weight:600;color:var(--suave)}
.st-lista{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.st-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:9px 10px;border-radius:10px;background:#fff;border:1px solid #f1cfcb}
.st-item.cerrado{border-color:var(--linea);background:#f4f2ec}
.st-nom b{font-size:15px}.st-nom small{display:block;color:var(--suave);font-size:12.5px}
.st-q{font-weight:800;color:var(--rojo)}.st-q.cero{background:var(--rojo);color:#fff;border-radius:6px;padding:0 6px}
.st-bts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.st-et{display:inline-block;padding:2px 8px;border-radius:999px;background:#e6f6ec;color:#14663a;font-size:12px;font-weight:800}
.st-et.gris{background:#e8e6df;color:#3d3b35}
.st-oc{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:#e6f6ec;font-size:13.5px}
.st-oc a{font-weight:800;color:#14663a}
@media (max-width:640px){.st-item{grid-template-columns:1fr}.st-bts{justify-content:flex-start}}
@media (max-width:1100px){.tablero{grid-template-columns:repeat(2,minmax(240px,1fr))}}
@media (max-width:640px){.tablero{grid-template-columns:1fr}.barra,.herr,.cuerpo{padding-left:12px;padding-right:12px}}
/* Editar el pedido y PDF (23/11/2026) */
.dlg.ed{max-width:660px}
.ed-lista{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ed-l{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;border:1.5px solid var(--linea);border-radius:12px;background:#fff}
.ed-l.menos{border-color:#f0c79a;background:#fffaf3}
.ed-l.fuera{border-color:#f0b8b2;background:#fdf3f2}
.ed-l.mas{border-color:#9bd3ad;background:#f2fbf5}
.ed-l.nueva{border-color:#9bc1e8;background:#f2f7fd}
.ag{margin-top:12px;padding:12px;border:1.5px dashed #c9c1ad;border-radius:12px;background:var(--papel)}
.ag label{display:block;margin-bottom:6px;font-size:14px}
.ag input{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--linea);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--tinta)}
.ag input:focus-visible{outline:none;border-color:var(--campo);box-shadow:0 0 0 3px rgba(31,95,58,.18)}
.ag-msg{margin:6px 0 0;color:var(--suave);font-size:12.5px}
.ag-res{display:grid;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.ag-res li{padding:10px 12px;border:1.5px solid var(--linea);border-radius:12px;background:#fff}
.ag-res b{display:block;font-size:14px;line-height:1.3}.ag-res small{display:block;color:var(--suave);font-size:12px}
.ag-res .ag-ago{display:inline;color:var(--rojo);font-weight:700}
.ag-ops{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ag-ops button{min-height:36px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--campo);background:#fff;color:var(--campo);font-weight:700;font-size:13px;cursor:pointer}
.ag-ops button:hover,.ag-ops button:focus-visible{background:#e6f6ec;outline:none}
.jn-sel{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 12px;border:1.5px solid var(--linea);border-radius:12px;background:#fff;color:var(--tinta);text-align:left;font:inherit;cursor:pointer}
.jn-sel[aria-pressed="true"]{border-color:var(--campo);background:#e6f6ec}
.jn-sel i{font-style:normal;font-size:22px;line-height:1;color:var(--campo)}
.jn-sel b{display:block;font-size:14.5px;line-height:1.3}.jn-sel small{display:block;color:var(--suave);font-size:12.5px}

<script>
/* SabAPP, el panel de pedidos del Catálogo Sabroso: lee la planilla cada 12 segundos y muestra los pedidos nuevos al instante.
   Los cambios de estado se guardan en la planilla (casilla «Confirmado» y columna «Estado»). */
var CADA = 12000;
var IVA = 0.19; // los precios de la carta llevan IVA; el neto de «Listos para retirar» es total ÷ 1,19
var datos = null, filtro = 'proximos', busqueda = '', vistos = null, nuevos = {}, abiertos = {}, ocupado = {}, seguro = {};
var audio = null, sonidoOn = false, ultimaOk = 0, temporizador = null, plegadas = {};
try { plegadas = JSON.parse(localStorage.getItem('panel-plegadas') || '{}') || {}; } catch (e) { plegadas = {}; }
var pestana = 'c-pc';
try { pestana = localStorage.getItem('panel-pestana') || 'c-pc'; } catch (e) { pestana = 'c-pc'; }
var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
var $ = function (id) { return document.getElementById(id); };
var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var clp = function (n) { return '$' + Math.round(n || 0).toLocaleString('es-CL'); };
try { vistos = JSON.parse(localStorage.getItem('panel-vistos') || 'null'); sonidoOn = localStorage.getItem('panel-sonido') === 'si'; } catch (e) { vistos = null; }

/* Dos modos: dentro de Google (cuenta @avicolasb.com) usa google.script.run; en www.avicolasb.com/sabapp
   se entra con correo + RUT y se habla con el script por su API, con la sesión de este PC (no se guarda el RUT). */
var API_SABAPP = ''; // la pone herramientas/sabapp/construir.js en la página de avicolasb.com
var MODO_API = !(window.google && google.script && google.script.run);
var ACCIONES = { panelDatos: 'datos', panelCambiar: 'cambiar', panelAsignar: 'asignar', panelAvisado: 'avisado', panelStock: 'stock', panelEditar: 'editar', panelJuntar: 'juntar' };
var sesion = ''; try { sesion = localStorage.getItem('sabapp-sesion') || ''; } catch (e) {}
function api(cuerpo) {
  return fetch(API_SABAPP, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ tipo: 'sabapp' }, cuerpo)) })
    .then(function (r) { return r.json(); });
}
function servidor(fn, args, ok, mal) {
  mal = mal || function (e) { estadoConexion(false, e); };
  if (!MODO_API) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(mal); r[fn].apply(r, args || []); return; }
  if (!sesion) { mostrarIngreso(''); return; }
  api({ accion: ACCIONES[fn], token: sesion, args: args || [] })
    .then(function (j) { if (j && j.ok) ok(j.datos); else if (j && j.cambiar) mostrarCambio(true); else mal(new Error(j && j.error || 'Sin respuesta')); })
    .catch(function (e) { mal(e); });
}
function mostrarIngreso(msg) {
  clearTimeout(temporizador);
  $('admin').hidden = true; $('bAdmin').hidden = true; $('bClave').hidden = true; $('cambio').hidden = true;
  $('ingreso').hidden = false; $('iMsg').textContent = msg || '';
  try { $('iCorreo').value = $('iCorreo').value || localStorage.getItem('sabapp-correo') || ''; } catch (e) {}
  ($('iCorreo').value ? $('iRut') : $('iCorreo')).focus();
}
$('iVer').addEventListener('change', function () { $('iRut').type = this.checked ? 'text' : 'password'; });
$('fIngreso').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var correo = $('iCorreo').value.trim(), rut = $('iRut').value.trim();
  if (!correo || !rut) { $('iMsg').textContent = 'Escribe tu correo y tu clave.'; return; }
  $('iBtn').disabled = true; $('iBtn').textContent = 'Entrando…'; $('iMsg').textContent = '';
  api({ accion: 'ingresar', correo: correo, clave: rut }).then(function (j) {
    $('iBtn').disabled = false; $('iBtn').textContent = 'Entrar';
    if (!j || !j.ok) { $('iMsg').textContent = j && j.error || 'No se pudo entrar.'; $('iRut').select(); return; }
    sesion = j.token; $('iRut').value = '';
    try { localStorage.setItem('sabapp-sesion', sesion); localStorage.setItem('sabapp-correo', correo); } catch (e) {}
    $('ingreso').hidden = true; $('bSalir').hidden = false;
    if (j.cambiar) { claveTemp = rut; mostrarCambio(true); return; }
    cargar(); programar();
  }).catch(function () { $('iBtn').disabled = false; $('iBtn').textContent = 'Entrar'; $('iMsg').textContent = 'Sin conexión: revisa internet e intenta de nuevo.'; });
});
/* ---------- Panel de administrador: trabajadores (correo + RUT + rol), sesiones abiertas y estado del sistema ---------- */
var VERSION_SABAPP = '23/11/2026 · códigos MyPyme (planilla 7) · editar pedido y PDF';
var admLista = [], admYo = '', admSeguro = {};
function admMsg(t, mal) { $('admMsg').textContent = t || ''; $('admMsg').className = 'adm-msg' + (mal ? ' mal' : ''); }
function admPintar(l, yo) {
  if (l) admLista = l; if (yo) admYo = yo;
  $('admLista').innerHTML = admLista.length ? admLista.map(function (x) {
    var soy = x.correo === admYo;
    return '<li><div><b>' + esc(x.nombre) + (x.admin ? '<span class="adm-et">Administrador</span>' : '') + (soy ? '<span class="adm-et">Tú</span>' : '') + '</b><small>' + esc(x.correo)
      + (x.sesiones ? ' · ' + x.sesiones + ' PC con sesión abierta' : ' · sin sesiones abiertas') + (x.cambiar ? ' · aún no crea su clave' : '') + '</small></div>'
      + '<button type="button" class="b peq" data-aeditar="' + esc(x.correo) + '">Editar</button>'
      + (soy ? '' : '<button type="button" class="b peq' + (admSeguro['r:' + x.correo] ? ' seguro' : '') + '" data-areiniciar="' + esc(x.correo) + '">' + (admSeguro['r:' + x.correo] ? '¿Reiniciar? Toca otra vez' : 'Reiniciar clave') + '</button>')
      + (x.sesiones ? '<button type="button" class="b peq" data-acerrar="' + esc(x.correo) + '">Cerrar sesiones</button>' : '')
      + (soy ? '' : '<button type="button" class="b peq peligro' + (admSeguro[x.correo] ? ' seguro' : '') + '" data-aquitar="' + esc(x.correo) + '">' + (admSeguro[x.correo] ? '¿Quitar? Toca otra vez' : 'Quitar') + '</button>') + '</li>';
  }).join('') : '<li><small>Aún no hay trabajadores.</small></li>';
  var ses = admLista.reduce(function (t, x) { return t + (x.sesiones || 0); }, 0), adm = admLista.filter(function (x) { return x.admin; }).length;
  $('admSis').innerHTML = [['Versión de SabAPP', VERSION_SABAPP], ['Tu cuenta', (datos && datos.usuario || '') + ' · ' + admYo],
    ['Conexión', ultimaOk ? 'En vivo · actualizado ' + horaCorta(new Date(ultimaOk)) : 'Sin datos aún'], ['Pedidos cargados', datos ? datos.pedidos.length : 0],
    ['Trabajadores', admLista.length + ' (' + adm + ' administrador' + (adm === 1 ? '' : 'es') + ')'], ['Sesiones abiertas', ses]]
    .map(function (f) { return '<li><span>' + f[0] + '</span><b>' + esc(f[1]) + '</b></li>'; }).join('');
}
function admApi(accion, args, listo) {
  admMsg(accion === 'trabajadores' ? 'Cargando…' : 'Guardando…');
  api({ accion: accion, token: sesion, args: args || [] }).then(function (j) {
    if (j && j.ok) { admMsg(''); admPintar(j.lista, j.yo); if (listo) listo(); return; }
    var e = j && j.error || 'No se pudo.';
    if (/Sin acceso/.test(e)) { sinAcceso(e); return; }
    admMsg(e, true);
  }).catch(function () { admMsg('Sin conexión: revisa internet e intenta de nuevo.', true); });
}
function admNuevo() { $('aNom').value = ''; $('aCor').value = ''; $('aRut').value = claveTemporal(); $('aCam').checked = true; $('aAdm').checked = false; $('aCor').readOnly = false; $('aGuardar').textContent = 'Guardar trabajador'; }
// Clave temporal fácil de dictar: 10 letras (consonante + vocal)
function claveTemporal() { var co = 'bcdfghjklmnprstv', vo = 'aeiou', a = new Uint32Array(10), r = ''; crypto.getRandomValues(a); for (var i = 0; i < 5; i++) r += co[a[2 * i] % co.length] + vo[a[2 * i + 1] % vo.length]; return r; }
$('aGen').addEventListener('click', function () { $('aRut').value = claveTemporal(); $('aCam').checked = true; });
$('bAdmin').addEventListener('click', function () { $('admin').hidden = false; admNuevo(); admPintar(); admApi('trabajadores'); $('aNom').focus(); });
$('admCerrar').addEventListener('click', function () { $('admin').hidden = true; $('bAdmin').focus(); });
$('admin').addEventListener('click', function (e) { if (e.target === $('admin')) { $('admin').hidden = true; $('bAdmin').focus(); } });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('admin').hidden) { $('admin').hidden = true; $('bAdmin').focus(); } });
$('aNuevo').addEventListener('click', function () { admNuevo(); admMsg(''); $('aNom').focus(); });
$('admRecargar').addEventListener('click', function () { location.reload(); });
$('admForm').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var n = $('aNom').value.trim(), c = $('aCor').value.trim(), r = $('aRut').value.trim(), ad = $('aAdm').checked, ca = $('aCam').checked;
  if (!n || !c) { admMsg('Escribe el nombre y el correo.', true); return; }
  admApi('guardarTrabajador', [n, c, r, ad, ca], function () { admNuevo(); admMsg('Guardado: ' + n + (ad ? ' (administrador)' : '') + (r ? '. Clave' + (ca ? ' temporal' : '') + ' para entrar: ' + r + (ca ? ' (al entrar creará la suya)' : '') : '') + '.'); });
});
$('admLista').addEventListener('click', function (e) {
  var ed = e.target.closest('[data-aeditar]'), ce = e.target.closest('[data-acerrar]'), qu = e.target.closest('[data-aquitar]');
  if (ed) { var x = admLista.filter(function (t) { return t.correo === ed.dataset.aeditar; })[0]; if (!x) return;
    $('aNom').value = x.nombre; $('aCor').value = x.correo; $('aCor').readOnly = true; $('aRut').value = ''; $('aAdm').checked = !!x.admin;
    $('aGuardar').textContent = 'Guardar cambios'; admMsg('Editando a ' + x.nombre + ': la clave en blanco se mantiene.'); $('aNom').focus(); return; }
  var re = e.target.closest('[data-areiniciar]');
  if (re) { var y = admLista.filter(function (t) { return t.correo === re.dataset.areiniciar; })[0]; if (!y) return;
    if (!admSeguro['r:' + y.correo]) { admSeguro['r:' + y.correo] = true; admPintar(); setTimeout(function () { delete admSeguro['r:' + y.correo]; if (!$('admin').hidden) admPintar(); }, 4000); return; }
    delete admSeguro['r:' + y.correo];
    var tmp = claveTemporal();
    admApi('guardarTrabajador', [y.nombre, y.correo, tmp, !!y.admin, true], function () { admMsg('Nueva clave temporal de ' + y.nombre + ': ' + tmp + ' (al entrar creará la suya; sus sesiones se cerraron).'); }); return; }
  if (ce) { admApi('cerrarSesiones', [ce.dataset.acerrar], function () { admMsg('Listo: se cerraron sus sesiones en los otros PC.'); }); return; }
  if (qu) { var k = qu.dataset.aquitar;
    if (!admSeguro[k]) { admSeguro[k] = true; admPintar(); setTimeout(function () { delete admSeguro[k]; if (!$('admin').hidden) admPintar(); }, 4000); return; }
    delete admSeguro[k]; admApi('quitarTrabajador', [k], function () { admMsg('Listo: ya no puede entrar a SabAPP.'); }); }
});

/* ---------- «Crea tu clave» (primer ingreso con clave temporal) y «🔑 Mi clave» ---------- */
var claveTemp = '', cambioObligado = false;
function mostrarCambio(obligado) {
  cambioObligado = obligado;
  if (obligado) clearTimeout(temporizador);
  $('cTit').textContent = obligado ? 'Crea tu clave' : 'Cambia tu clave';
  $('cTxt').textContent = obligado ? 'Es tu primer ingreso: crea tu propia clave. La clave temporal dejará de servir.' : 'Escribe tu clave actual y la nueva.';
  $('cActualL').hidden = obligado && !!claveTemp; $('cCancelar').hidden = obligado;
  ['cActual', 'cNueva', 'cRepite'].forEach(function (i) { $(i).value = ''; });
  $('cMsg').textContent = ''; $('cambio').hidden = false;
  ($('cActualL').hidden ? $('cNueva') : $('cActual')).focus();
}
$('cVer').addEventListener('change', function () { var t = this.checked ? 'text' : 'password'; ['cActual', 'cNueva', 'cRepite'].forEach(function (i) { $(i).type = t; }); });
$('cCancelar').addEventListener('click', function () { $('cambio').hidden = true; });
$('bClave').addEventListener('click', function () { mostrarCambio(false); });
$('fCambio').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var actual = $('cActualL').hidden ? claveTemp : $('cActual').value.trim(), nueva = $('cNueva').value.trim();
  if (!actual) { $('cMsg').textContent = 'Escribe tu clave actual.'; return; }
  if (nueva.length < 6) { $('cMsg').textContent = 'La clave nueva debe tener al menos 6 caracteres.'; return; }

  return /(¡Gracias por su compra!|¡Lo esperamos!|¡Gracias!)$/.test(m) ? m.replace(/ ?(¡Gracias por su compra!|¡Lo esperamos!|¡Gracias!)$/, ' ' + nota + ' $1') : m + ' ' + nota;
}
function wspEnlace(p, tipo) {

}
// «Sofía atenderá tu pedido…» para el cliente que espera en el local
function mensajeAtiende(p, quien) {
  var nom = /^\(/.test(p.cliente || '') ? '' : String(p.cliente || '').trim().split(/\s+/)[0];
  nom = nom ? nom.charAt(0).toUpperCase() + nom.slice(1) : '';
  return '¡Hola' + (nom ? ' ' + nom : '') + '! ' + quien + ' atenderá tu pedido ' + p.codigo + ', ¡lo estamos preparando! Te lo entregamos en el mesón de Emporio Sabroso.';
}
// Se avisa a quien está en el local la primera vez que se elige quién lo atiende: por correo (lo envía la planilla) o por WhatsApp (se abre aquí)
function avisoAtiendePor(p) {
  if (!p || !enLocal(p) || p.prepara) return '';
  if (correoEnlace(p, 'listo')) return 'correo';
  return wspEnlace(p, 'listo') ? 'wsp' : '';
}
function asunto(p, tipo) {
  if (tipo === 'listo' && despachoOtroDia(p)) return 'Su pedido ' + p.codigo + ' está listo y será enviado el día acordado · Emporio Sabroso';
  if (tipo === 'listo' && esDespacho(p)) return 'Su pedido ' + p.codigo + ' va en camino · Emporio Sabroso';

}
function correoEnlace(p, tipo) {
  if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(String(p.correo || ''))) return '';
  return 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(p.correo) + '&su=' + encodeURIComponent(asunto(p, tipo)) + '&body=' + encodeURIComponent(mensaje(p, tipo));
}
function enlaceDe(p, medio, tipo) { return medio === 'correo' ? correoEnlace(p, tipo) : wspEnlace(p, tipo); }
function copiar(texto) {
  var ok = false, t = document.createElement('textarea');
  t.value = texto; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select();

  if (!ok && navigator.clipboard) { navigator.clipboard.writeText(texto).then(function () {}, function () {}); ok = true; }
  return ok;
}

function boton(p, estado, texto, clase, medio) {

    + (medio ? ' data-avisa="' + medio + '"' : '') + (ocupado[p.codigo] ? ' disabled' : '') + '>' + t + '</button>';
}

function tarjeta(p) {
  var cerrado = ['Entregado', 'Anulado', 'No llegó'].indexOf(p.estado) >= 0;
  var items = p.items.length ? p.items : [];
  var largo = items.length > 5 && !abiertos[p.codigo];

  var acc = '';
  // Medios para avisar: el correo primero si el cliente lo dejó (lo eligió en el pedido); luego WhatsApp

  };

    acc = boton(p, 'Confirmado', '✓ Confirmar pedido', 'prim') + confirmacion('') + botonEditar(p) + botonJuntar(p) + boton(p, 'No llegó', 'No llegó', 'peq peligro');
  } else if (p.estado === 'Confirmado') {
    // Un solo toque deja el pedido «listo» y abre el aviso escrito (por correo o WhatsApp)
    acc = (medios.length ? medios.map(function (m, i) { return boton(p, 'Preparado', 'Listo · avisar por ' + nombreMedio(m), i ? (m === 'correo' ? 'correo' : 'wsp') : 'prim azul', m); }).join('') : boton(p, 'Preparado', 'Listo para retirar', 'prim azul'))
      + confirmacion('peq') + botonEditar(p) + botonJuntar(p) + botonPdf(p) + boton(p, 'Por confirmar', '↩ Volver', 'peq') + boton(p, 'Anulado', 'Anular', 'peq peligro');
  } else if (p.estado === 'Preparado') {
    acc = boton(p, 'Entregado', '✓ Entregado', 'prim')
      + (medios.length
        ? medios.map(function (m) { return '<a class="b ' + (m === 'correo' ? 'correo' : 'wsp') + '" data-avisado="' + esc(p.codigo) + '" data-medio="' + m + '" href="' + enlaceDe(p, m, 'listo') + '">' + (p.avisado && (p.avisadoPor === 'correo') === (m === 'correo') ? 'Volver a avisar por ' : 'Avisar por ') + nombreMedio(m) + '</a>'; }).join('')
        : '<button type="button" class="b wsp" data-copiar="' + esc(p.codigo) + '">Copiar aviso para el chat</button>')
      + botonPdf(p, true) + botonEditar(p) + botonJuntar(p) + boton(p, 'Confirmado', '↩ Volver', 'peq') + boton(p, 'Anulado', 'Anular', 'peq peligro');
  } else {

    acc = '<span class="p-cel">' + esc(p.estado) + '</span>' + (p.estado === 'Entregado' ? botonPdf(p) : '') + (juntadoCon(p) ? '' : boton(p, p.estado === 'Entregado' ? 'Preparado' : 'Por confirmar', '↩ Reabrir', 'peq'));

  return '<article class="ped' + (p.prioridad === 'Alta' ? ' alta' : '') + (nuevos[p.codigo] ? ' nuevo' : '') + (cerrado ? ' cerrado' : '') + '" data-ped="' + esc(p.codigo) + '">'
    + '<div class="p-cab"><span class="p-cod">' + esc(p.codigo) + '</span>'
    + (nuevos[p.codigo] ? '<span class="tag t-nuevo">Nuevo</span>' : '')
    + (enLocal(p) && !cerrado ? '<span class="tag t-local">Cliente en el local</span>' : '')
    + (p.prioridad === 'Alta' ? '<span class="tag t-alta">Prioridad alta</span>' : '')

    + (p.juntados && p.juntados.length ? '<span class="tag t-junt">Incluye ' + esc(p.juntados.join(', ')) + '</span>' : '') + '</div>'

    + (p.celular || p.correo || p.codigoCliente ? '<div class="p-cel">' + esc([p.celular, p.correo, p.codigoCliente].filter(Boolean).join(' · ')) + '</div>' : '')
    + (enLocal(p) ? '<div class="p-ret local">🛍️ Está en el local · ' + esc(diaLargo(p.dia)) + ' ' + etiquetaDia(p.dia) + '</div>'
      : esDespacho(p) ? '<div class="p-ret">🚚 Despacho ' + esc(diaLargo(p.dia)) + ' · ' + esc(String(p.hora).replace(/^Despacho\s*/i, '').replace(/-/, ' a ')) + ' ' + etiquetaDia(p.dia) + '</div>'

    + chipPrepara(p, cerrado)
    + (esMayorHuevos(p) ? (function () { var o = otraMayorSemana(p), f = o && o.recibido ? new Date(o.recibido) : null;
        return o ? '<div class="p-mayor repite">⚠ Huevos por mayor: este cliente ya compró por mayor el ' + (f ? ('0' + f.getDate()).slice(-2) + '/' + ('0' + (f.getMonth() + 1)).slice(-2) : 'esta semana') + ' (pedido ' + esc(o.codigo) + '). La regla es 1 vez por semana.</div>'

    // Listos para retirar: también el neto, sin IVA (David, 23/11/2026: «agrega en la lista para retirar el precio neto también»)
    + (p.estado === 'Preparado' && p.total ? '<span class="p-neto">Neto <strong>' + clp(Math.round(p.total / (1 + IVA))) + '</strong> sin IVA</span>' : '') + '</div>'
    + (p.avisado && ['Preparado', 'Entregado'].indexOf(p.estado) >= 0 ? '<div class="p-avisado">✓ Cliente avisado por ' + (p.avisadoPor === 'correo' ? 'correo' : 'WhatsApp') + (p.avisadoEl ? ' · ' + esc(p.avisadoEl) : '') + '</div>' : '')

}

// «👤 Prepara: Sofía» (se toca para cambiarla); en un pedido confirmado sin nadie, «Elegir quién prepara»
function chipPrepara(p, cerrado) {

  if (p.estado === 'Confirmado' && hay) return '<div><button type="button" class="p-prep falta" data-asignar="' + esc(p.codigo) + '" data-foco="as-' + esc(p.codigo) + '"' + (ocupado[p.codigo] ? ' disabled' : '') + '>👤 Elegir quién prepara</button></div>';

}

function ladoHTML() {
  var man = sumarDias(datos.hoy, 1);
  var bloque = function (iso, titulo) {
    var tot = {}, cod = {};
    datos.pedidos.filter(function (p) { return p.estado === 'Confirmado' && p.dia === iso; }).forEach(function (p) {
      p.items.forEach(function (x) { if (!(x.q > 0)) return; tot[x.nombre] = (tot[x.nombre] || 0) + x.q; if (x.cod) cod[x.nombre] = x.cod; });
    });
    var ks = Object.keys(tot).sort(function (a, b) { return tot[b] - tot[a]; });
    if (!ks.length) return '';
    return '<h4>' + titulo + '</h4><ul>' + ks.map(function (k) { return '<li><span>' + (cod[k] ? '<small>' + esc(cod[k]) + '</small>' : '') + esc(k) + '</span><b>' + tot[k] + '</b></li>'; }).join('') + '</ul>';
  };
  // Solo aparece cuando hay algo confirmado para hoy o mañana
  var dias = bloque(datos.hoy, 'Hoy') + bloque(man, 'Mañana');
  return dias ? '<aside class="lado"><div class="caja' + (plegadas.lado ? ' plegada' : '') + '"><h3>' + titulo('lado', 'Por preparar', !!plegadas.lado) + '</h3>' + dias + '</div></aside>' : '';
}

/* ---------- Quién prepara ---------- */
function pedido(c) { return datos ? datos.pedidos.filter(function (x) { return x.codigo === c; })[0] : null; }
var modalDe = null; // { cod, modo: 'confirmar' (al confirmar) o 'asignar' (cambiar después), volver: botón que la abrió }
function iniciales(n) { return n.split(/\s+/).map(function (w) { return w.charAt(0); }).join('').slice(0, 2).toUpperCase(); }
function elegirQuienPrepara(cod, modo) {
  var p = pedido(cod); if (!p) return;
  var ultimo = ''; try { ultimo = localStorage.getItem('panel-ultimo-prepara') || ''; } catch (e) {}
  if (!ultimo && datos.vendedores.indexOf(datos.usuario) >= 0) ultimo = datos.usuario;
  modalDe = { cod: cod, modo: modo, volver: document.activeElement };
  var por = avisoAtiendePor(p);
  $('mSub').textContent = p.codigo + ' · ' + (p.cliente || '(sin nombre)') + ' · ' + (enLocal(p) ? 'está en el local' : 'retira ' + diaLargo(p.dia))
    + (modo === 'confirmar' ? '. Al elegir, el pedido queda confirmado.' : '.')
    + (por === 'correo' ? ' Le enviamos al cliente un correo: «(nombre) atenderá tu pedido».' : por === 'wsp' ? ' Se abre WhatsApp con el aviso para el cliente: «(nombre) atenderá tu pedido».' : '');
  $('mVend').innerHTML = datos.vendedores.map(function (n) {
    var cl = n === p.prepara ? 'actual' : (!p.prepara && n === ultimo ? 'ult' : '');
    return '<button type="button" data-vend="' + esc(n) + '"' + (cl ? ' class="' + cl + '"' : '') + '><i aria-hidden="true">' + esc(iniciales(n)) + '</i>' + esc(n)
      + (cl === 'actual' ? '<small>ahora</small>' : cl === 'ult' ? '<small>la última vez</small>' : '') + '</button>';
  }).join('');
  $('modal').hidden = false;
  var f = $('mVend').querySelector('.actual,.ult') || $('mVend').querySelector('button');
  if (f) f.focus();
}
function cerrarModal() {
  var v = modalDe && modalDe.volver; modalDe = null; $('modal').hidden = true;
  if (v && document.body.contains(v)) v.focus();
}
function quienPrepara(nombre) {
  var m = modalDe; if (!m) return;
  cerrarModal();
  try { localStorage.setItem('panel-ultimo-prepara', nombre); } catch (e) {}
  var p = pedido(m.cod), por = avisoAtiendePor(p), avisoWsp = false;
  if (por === 'wsp') { // se abre en el mismo toque (si no, el navegador lo bloquea)
    var num = String(p.celular).replace(/\D/g, '');
    window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(mensajeAtiende(p, nombre)), '_blank', 'noopener');
    avisoWsp = true;
  }
  if (m.modo === 'confirmar') { cambiarEstado(m.cod, 'Confirmado', false, nombre, avisoWsp); return; }
  var antes = p ? p.prepara : '';
  if (p) p.prepara = nombre;
  ocupado[m.cod] = true; pintar();
  servidor('panelAsignar', [m.cod, nombre, avisoWsp], function (d) { delete ocupado[m.cod]; recibir(d); estadoConexion(true); avisar(textoAviso(m.cod, 'prepara ' + nombre, d.avisoAtiende)); },
    function (err) { delete ocupado[m.cod]; if (p) p.prepara = antes; pintar(); avisar('No se pudo guardar: ' + String(err && err.message || err)); });
}
document.addEventListener('keydown', function (e) {
  if (junta) {
    if (e.key === 'Escape') { cerrarJuntar(); return; }
    if (e.key === 'Tab') { // el foco no sale de la ventana
      var jb = [].filter.call($('mJuntar').querySelectorAll('button'), function (b) { return !b.disabled; }), jp = jb[0], ju = jb[jb.length - 1];
      if (e.shiftKey && document.activeElement === jp) { ju.focus(); e.preventDefault(); }
      else if (!e.shiftKey && document.activeElement === ju) { jp.focus(); e.preventDefault(); }
    }
    return;
  }
  if (edicion) {
    if (e.key === 'Escape') { cerrarEdicion(); return; }
    if (e.key === 'Tab') { // el foco no sale de la ventana
      var eb = [].filter.call($('mEditar').querySelectorAll('button'), function (b) { return !b.disabled; }), ep = eb[0], eu = eb[eb.length - 1];
      if (e.shiftKey && document.activeElement === ep) { eu.focus(); e.preventDefault(); }
      else if (!e.shiftKey && document.activeElement === eu) { ep.focus(); e.preventDefault(); }
    }
    return;
  }
  if (!modalDe) return;
  if (e.key === 'Escape') { cerrarModal(); return; }
  if (e.key === 'Tab') { // el foco no sale de la ventana
    var bs = $('modal').querySelectorAll('button'), pri = bs[0], ult = bs[bs.length - 1];
    if (e.shiftKey && document.activeElement === pri) { ult.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === ult) { pri.focus(); e.preventDefault(); }
  }
});

// Texto del aviso de abajo a la derecha, con el resultado del aviso al cliente
function textoAviso(cod, hecho, a) {
  if (!a) return cod + ': ' + hecho;
  if (a.medio === 'correo') return a.ok ? cod + ': ' + hecho + ' · correo enviado al cliente («' + a.prepara + ' atenderá tu pedido»)' : cod + ': ' + hecho + ' · NO se pudo enviar el correo al cliente';
  return cod + ': ' + hecho + ' · se abrió WhatsApp con el aviso: falta tocar Enviar';
}

function cambiarEstado(cod, est, conAviso, prepara, avisoWsp) {
  delete seguro[cod + '>' + est]; delete nuevos[cod];
  ocupado[cod] = true;
  var p = pedido(cod);
  var antes = p ? p.estado : '', antesP = p ? p.prepara : '';
  if (p) { p.estado = est; if (prepara) p.prepara = prepara; } // se ve al instante; la planilla confirma enseguida
  pintar();
  servidor('panelCambiar', [cod, est, conAviso, prepara || '', !!avisoWsp], function (d) {
    delete ocupado[cod]; recibir(d); estadoConexion(true);
    avisar(textoAviso(cod, est.toLowerCase() + (prepara ? ' · prepara ' + prepara : ''), d.avisoAtiende));
  }, function (err) {
    delete ocupado[cod]; if (p) { p.estado = antes; p.prepara = antesP; } pintar();
    avisar('No se pudo guardar: ' + String(err && err.message || err));
  });
}

/* ---------- Editar el pedido (David, 23/11/2026: «cuando avise por WhatsApp al cliente que está listo su pedido, pueda editar el pedido
   eliminando lo que no tenemos o lo que el cliente me dijo que no quiere, y luego pueda mandarle un PDF con el pedido y su detalle»).
   Se quita o se rebaja cada producto con su motivo; se guarda en la planilla (panelEditar) y lo ven todos los equipos.
   Desde el 23/11 también se sube sobre lo pedido (David: «nos piden más por WhatsApp»): motivo «El cliente pidió más». ---------- */
var MOTIVOS = ['Sin stock', 'El cliente no lo quiere'], MOTIVO_MAS = 'El cliente pidió más', MAX_Q = 9999;
var fmtQ = function (n) { return String(Math.round((Number(n) || 0) * 1000) / 1000).replace('.', ','); };
var esTapa = function (x) { return /^↳/.test(x.nombre || ''); };
var cambiada = function (x) { return x.pedida != null && x.pedida !== x.q; };

var motivoDe = function (x) { return String(x.cambio || '').split(' · ')[0]; };
// El script del 23/11 manda «codCarta» en cada línea: con el script anterior no se ofrece editar
var puedeEditar = function (p) { return ['Por confirmar', 'Confirmado', 'Preparado'].indexOf(p.estado) >= 0 && p.items.length > 0 && 'codCarta' in p.items[0]; };
var despachoDe = function (p) { var m = String(p.comentario || '').match(/DESPACHO \$([\d.]+)/); return m ? Number(m[1].replace(/\./g, '')) || 0 : 0; };
var agregada = function (x) { return x.pedida === 0; }; // la agregó un vendedor desde el catálogo (no estaba en el pedido del cliente)
function itemHTML(x) {
  var c = cambiada(x), fuera = c && !(x.q > 0), mot = motivoDe(x), ag = agregada(x);
  return '<li' + (fuera ? ' class="quitado"' : '') + '><b>' + fmtQ(x.q) + ' ×</b><span>' + (fuera ? '<s>' + esc(x.nombre) + '</s>' : esc(x.nombre))
    + (x.cod ? ' <small class="p-sku">' + esc(x.cod) + '</small>' : '')
    + (c ? ' <em class="p-cambio">' + (fuera ? 'quitado' : ag ? 'agregado' : 'pidió ' + fmtQ(x.pedida)) + (mot && !ag ? ' · ' + esc(mot.toLowerCase()) : '') + '</em>' : '') + '</span></li>';
}
function botonEditar(p) {
  return puedeEditar(p) ? '<button type="button" class="b peq" data-editar="' + esc(p.codigo) + '" data-foco="ed-' + esc(p.codigo) + '"' + (ocupado[p.codigo] ? ' disabled' : '') + '>✏️ Editar pedido</button>' : '';
}
function botonPdf(p, grande) {
  return '<button type="button" class="b ' + (grande ? 'pdf' : 'peq') + '" data-pdf="' + esc(p.codigo) + '" data-foco="pdf-' + esc(p.codigo) + '">📄 ' + (grande ? 'Enviar PDF del pedido' : 'PDF del pedido') + '</button>';
}

/* Agregar un producto del catálogo (David, 23/11/2026: «quiero agregar un producto del catálogo yo como vendedor al pedido, no de los que ya me pidió

    if (e.target.closest('#eGuardar')) { guardarEdicion(); return; }
    var agb = e.target.closest('[data-agp]');
    if (agb && $('eRes').contains(agb)) { agregarOpcion(Number(agb.dataset.agp), Number(agb.dataset.ago)); return; }
    clicEdicion(e.target);
    return;
  }
  var edb = e.target.closest('button[data-editar]');
  if (edb) { if (!edb.disabled) abrirEdicion(edb.dataset.editar); return; }
  var jnb = e.target.closest('button[data-juntar]');
  if (jnb) { if (!jnb.disabled) abrirJuntar(jnb.dataset.juntar); return; }
  var pdb = e.target.closest('button[data-pdf]');
  if (pdb) { enviarPdf(pdb.dataset.pdf); return; }
  if (modalDe) {
    var vb = e.target.closest('[data-vend]');
    if (vb) { quienPrepara(vb.dataset.vend); return; }
    if (e.target.closest('[data-cerrar]') || e.target === $('modal')) cerrarModal();
    return;
  }
  var stb = e.target.closest('button[data-stock]');
  if (stb) { if (!stb.disabled) decidirStock(stb); return; }
  var asg = e.target.closest('button[data-asignar]');
  if (asg) { elegirQuienPrepara(asg.dataset.asignar, 'asignar'); return; }
  var pt = e.target.closest('[data-pestana]');
  if (pt) {
    pestana = pt.dataset.pestana;
    try { localStorage.setItem('panel-pestana', pestana); } catch (err) {}
    pintar(); return;
  }
  var pg = e.target.closest('[data-plegar]');
  if (pg) {
    plegadas[pg.dataset.plegar] = !plegadas[pg.dataset.plegar];
    try { localStorage.setItem('panel-plegadas', JSON.stringify(plegadas)); } catch (err) {}
    pintar(); return;
  }
  var ab = e.target.closest('[data-abrir]');
  if (ab) { abiertos[ab.dataset.abrir] = true; pintar(); return; }
  var tj = e.target.closest('[data-ped]');
  if (tj && nuevos[tj.dataset.ped] && !e.target.closest('button,a')) { delete nuevos[tj.dataset.ped]; pintar(); }
  // «Avisar por WhatsApp / correo»: el enlace abre el aviso escrito y la planilla anota que el cliente fue avisado
  var av = e.target.closest('a[data-avisado]');
  if (av) {
    var pa = pedido(av.dataset.avisado), medioA = av.dataset.medio || 'wsp';
    if (pa) { pa.avisado = true; pa.avisadoPor = medioA === 'correo' ? 'correo' : 'WhatsApp'; pa.avisadoEl = horaCorta(new Date()); }
    servidor('panelAvisado', [av.dataset.avisado, medioA], function (d) { recibir(d); }, function () {});
    setTimeout(pintar, 50);
    return;
  }
  // Datos de transferencia: desde la barra (solo la cuenta) o desde un pedido (con su código y total)
  var tf = e.target.closest('[data-transf]');
  if (tf) {
    var pt = tf.dataset.transf ? pedido(tf.dataset.transf) : null;
    avisar(copiar(textoTransf(pt)) ? 'Datos de transferencia copiados: péguelos en el chat del cliente.' : 'No se pudo copiar.');
    return;
  }
  // Cliente sin celular: se copia el aviso para pegarlo en su chat (WhatsApp o Instagram)
  var cp = e.target.closest('button[data-copiar]');
  if (cp) {
    var pc = pedido(cp.dataset.copiar);
    if (pc) avisar(copiar(mensaje(pc, 'listo')) ? 'Aviso copiado: péguelo en el chat del cliente.' : 'No se pudo copiar el aviso.');
    return;
  }
  var b = e.target.closest('button[data-estado]');
  if (!b) return;
  var cod = b.dataset.cod, est = b.dataset.estado, k = cod + '>' + est;
  var conAviso = b.dataset.avisa || false; // 'wsp' o 'correo'
  if (conAviso) { // se abre en el mismo toque (si no, el navegador lo bloquea)
    var pw = pedido(cod), enlace = pw && enlaceDe(pw, conAviso, 'listo');
    if (enlace) { window.open(enlace, '_blank', 'noopener'); pw.avisado = true; pw.avisadoPor = conAviso === 'correo' ? 'correo' : 'WhatsApp'; pw.avisadoEl = horaCorta(new Date()); }
  }
  if (['Anulado', 'No llegó'].indexOf(est) >= 0 && !seguro[k]) {
    seguro[k] = true; pintar();
    setTimeout(function () { delete seguro[k]; pintar(); }, 4000);
    return;
  }
  // Al confirmar un pedido nuevo se elige quién lo prepara
  var pq = pedido(cod);
  if (est === 'Confirmado' && pq && pq.estado === 'Por confirmar' && datos.vendedores && datos.vendedores.length) { elegirQuienPrepara(cod, 'confirmar'); return; }
  cambiarEstado(cod, est, conAviso);
});

/* Inicio */
pintarSonido();
cargarLogoPdf();
if (MODO_API && !sesion) mostrarIngreso('');
else { if (MODO_API) $('bSalir').hidden = false; cargar(); programar(); }
setInterval(function () {
  if (MODO_API && !sesion) return;
  if (ultimaOk && Date.now() - ultimaOk > CADA * 3) estadoConexion(false);
  else if (datos) { $('vivoTxt').textContent = 'En vivo · actualizado ' + horaCorta(new Date(ultimaOk)); pintarRelativos(); }
}, 30000);
function pintarRelativos() { if (datos && !document.querySelector('.b:focus') && !$('q').matches(':focus')) pintar(); }
document.addEventListener('visibilitychange', function () { if (!document.hidden && (!MODO_API || sesion)) { cargar(); programar(); } });
</script>
