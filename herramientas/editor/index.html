<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Editor del Catálogo Sabroso</title>
<style>
:root{--campo:#1d5c36;--sol:#f07d1a;--papel:#f4f1ea;--tinta:#22221d;--suave:#6b6a62;--linea:#dcd6c8;--azul:#2357a8;--rojo:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--papel);color:var(--tinta);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.cab{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;background:var(--campo);color:#fff}
.cab b{font-size:17px;margin-right:8px}
.cab .grupo{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:10px;overflow:hidden}
.cab .grupo button{padding:6px 12px;border:0;background:transparent;color:#fff;font-weight:600}
.cab .grupo button[aria-pressed="true"]{background:#fff;color:var(--campo)}
.cab .bt{padding:6px 12px;border:1px solid rgba(255,255,255,.55);border-radius:10px;background:transparent;color:#fff;font-weight:600}
.cab .bt:disabled{opacity:.45;cursor:default}
.cab .bt[aria-pressed="true"]{background:var(--sol);border-color:var(--sol)}
.cab .estado{font-size:12.5px;opacity:.85;margin-left:auto}
.cab .prim{padding:7px 14px;border:0;border-radius:10px;background:var(--sol);color:#fff;font-weight:800}
.cuerpo{display:grid;grid-template-columns:190px 420px minmax(0,1fr);height:calc(100% - 52px)}
.pestanas{display:flex;flex-direction:column;gap:2px;padding:10px 8px;background:#e9e4d8;overflow:auto}
.pestanas button{display:flex;align-items:center;gap:8px;padding:9px 10px;border:0;border-radius:10px;background:transparent;color:var(--tinta);text-align:left;font-weight:600}
.pestanas button[aria-selected="true"]{background:#fff;color:var(--campo);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pestanas .ico{width:20px;text-align:center}
.panel{overflow:auto;padding:14px 16px 40px;background:#fff;border-right:1px solid var(--linea)}
.panel h2{margin:2px 0 4px;font-size:18px}
.panel h3{margin:18px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave)}
.panel p.nota{margin:0 0 12px;color:var(--suave);font-size:13px}
.fila{display:flex;align-items:center;gap:8px;margin:6px 0}
.fila label{flex:1}
.campo{display:grid;gap:3px;margin:8px 0}
.campo span{font-size:12px;font-weight:700;color:var(--suave)}
.campo input,.campo select,.campo textarea,.mini{width:100%;padding:7px 9px;border:1px solid var(--linea);border-radius:8px;background:#fff}
textarea{min-height:70px;resize:vertical}
.color{display:grid;grid-template-columns:40px 1fr 92px 30px;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0ece2}
.color input[type=color]{width:40px;height:32px;padding:0;border:1px solid var(--linea);border-radius:8px;background:none}
.color input[type=text]{padding:5px 7px;border:1px solid var(--linea);border-radius:8px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.color .rest{border:0;background:none;color:var(--suave);font-size:16px}
.contraste li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #f0ece2}
.contraste{list-style:none;margin:0;padding:0}
.ok{color:var(--campo);font-weight:700}.mal{color:var(--rojo);font-weight:700}
.tarjeta{border:1px solid var(--linea);border-radius:12px;padding:10px;margin:8px 0;background:#fffdf8}
.tarjeta.arrastrando{opacity:.5}
.tarjeta.sobre{outline:2px dashed var(--sol)}
.tarjeta .cab-t{display:flex;align-items:center;gap:6px}
.tarjeta .cab-t input{flex:1;font-weight:700}
.agarre{cursor:grab;color:var(--suave);padding:0 4px;user-select:none}
.ib{min-width:30px;height:30px;padding:0 7px;border:1px solid var(--linea);border-radius:8px;background:#fff;color:var(--tinta)}
.ib.rojo{color:var(--rojo)}
.ib:disabled{opacity:.35;cursor:default}
.secciones{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.secciones li{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;background:#f6f2e8}
.secciones li span{flex:1}
.secciones select{max-width:120px;padding:3px 4px;border:1px solid var(--linea);border-radius:6px;font-size:12px}
.vt-mini{display:grid;grid-template-columns:84px 1fr;gap:10px}
.vt-mini img{width:84px;height:62px;object-fit:cover;border-radius:8px;background:#eee}
.bt2{padding:7px 12px;border:1px solid var(--campo);border-radius:9px;background:#fff;color:var(--campo);font-weight:700}
.bt2.prim{background:var(--campo);color:#fff}
.bt2.rojo{border-color:var(--rojo);color:var(--rojo)}
table.prod{width:100%;border-collapse:collapse;font-size:12.5px}
table.prod th{position:sticky;top:-14px;background:#fff;text-align:left;font-size:11px;color:var(--suave);padding:6px 4px;border-bottom:1px solid var(--linea)}
table.prod td{padding:3px 4px;border-bottom:1px solid #f0ece2;vertical-align:middle}
table.prod input[type=text],table.prod input[type=number]{width:100%;padding:4px 5px;border:1px solid transparent;border-radius:6px;background:transparent}
table.prod input:hover,table.prod input:focus{border-color:var(--linea);background:#fff}
table.prod tr.cambiado td{background:#fff6e8}
table.prod tr.oculto td{color:#999}
.cod{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--suave)}
.resumen{margin:8px 0;padding-left:18px}
.resumen li{margin:3px 0}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef6f0;color:var(--campo);font-size:12px;font-weight:700}
.vista{position:relative;overflow:hidden;background:#d9d4c7}
.marco{position:absolute;top:14px;left:50%;transform-origin:top center;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.25);border-radius:14px;overflow:hidden}
.marco iframe{display:block;border:0;width:100%;height:100%;background:#fff}
.etiqueta-vista{position:absolute;right:12px;bottom:10px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:12px}
.aviso{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:var(--tinta);color:#fff;font-weight:700;display:none;z-index:9}
.aviso.ver{display:block}
.sel-info{padding:8px 10px;border-radius:10px;background:#f6f2e8;font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
.check{display:flex;align-items:center;gap:8px;margin:6px 0}
@media (max-width:1100px){.cuerpo{grid-template-columns:150px 360px minmax(0,1fr)}}
</style>
</head>
<body>
<header class="cab">
  <b>Editor del Catálogo Sabroso</b>
  <div class="grupo" role="group" aria-label="Tamaño de la vista">
    <button type="button" data-ancho="390" aria-pressed="true">Celular</button>
    <button type="button" data-ancho="820" aria-pressed="false">Tablet</button>
    <button type="button" data-ancho="1366" aria-pressed="false">PC</button>
  </div>
  <button type="button" class="bt" id="bAntes" aria-pressed="false" title="Ver el catálogo como está publicado">Ver antes</button>
  <button type="button" class="bt" id="bDeshacer" disabled>↶ Deshacer</button>
  <button type="button" class="bt" id="bRehacer" disabled>↷ Rehacer</button>
  <span class="estado" id="estadoTxt">Cargando el catálogo…</span>
  <button type="button" class="prim" id="bEnviar">Enviar a Claude</button>
</header>
<div class="cuerpo">
  <nav class="pestanas" role="tablist" aria-label="Herramientas">
    <button type="button" role="tab" data-p="colores" aria-selected="true"><span class="ico">🎨</span>Colores</button>
    <button type="button" role="tab" data-p="menu" aria-selected="false"><span class="ico">☰</span>Menú y orden</button>
    <button type="button" role="tab" data-p="vitrina" aria-selected="false"><span class="ico">🖼</span>Vitrina</button>
    <button type="button" role="tab" data-p="productos" aria-selected="false"><span class="ico">📦</span>Productos y precios</button>
    <button type="button" role="tab" data-p="promos" aria-selected="false"><span class="ico">%</span>Promos y ofertas</button>
    <button type="button" role="tab" data-p="textos" aria-selected="false"><span class="ico">✎</span>Textos</button>
    <button type="button" role="tab" data-p="seleccion" aria-selected="false"><span class="ico">⌖</span>Elegir en la vista</button>
    <button type="button" role="tab" data-p="opciones" aria-selected="false"><span class="ico">⚙</span>Opciones</button>
    <button type="button" role="tab" data-p="enviar" aria-selected="false"><span class="ico">➤</span>Enviar a Claude</button>
  </nav>
  <section class="panel" id="panel" role="tabpanel"></section>
  <main class="vista" id="vista">
    <div class="marco" id="marco"><iframe id="frame" title="Vista previa del Catálogo Sabroso"></iframe></div>
    <span class="etiqueta-vista" id="etiquetaVista">Con tus cambios</span>
  </main>
</div>
<div class="aviso" id="aviso" role="status"></div>
<script src="cambios.js"></script>
<script>
/* Editor del Catálogo Sabroso: solo funciona en este PC (servidor local). Lee carta/index.html, muestra la vista en vivo
   y guarda tus cambios como borrador. «Enviar a Claude» descarga un archivo con los cambios para publicarlos. */
var E = window.EditorCatalogo;
var $ = function (id) { return document.getElementById(id); };
var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var clon = function (o) { return JSON.parse(JSON.stringify(o)); };
var BORRADOR = 'editor-catalogo-borrador';
var htmlBase = '', huellaBase = 0, base = null, estado = null, historial = [], futuro = [];
var pestana = 'colores', ancho = 390, verAntes = false, imagenes = [], filtroProd = { q: '', cat: '' }, seleccionando = false, elegido = null;

function huella(s) { var h = 0; for (var k = 0; k < s.length; k++) h = (h * 31 + s.charCodeAt(k)) | 0; return h; }
function avisar(t) { var a = $('aviso'); a.textContent = t; a.classList.add('ver'); clearTimeout(avisar.t); avisar.t = setTimeout(function () { a.classList.remove('ver'); }, 2600); }
function slug(t) { return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function rutaImg(r) { return r ? (r.indexOf('../') === 0 ? '/' + r.slice(3) : r) : ''; }

/* ---------- Inicio ---------- */
async function iniciar() {
  try {
    htmlBase = await (await fetch('/carta/index.html', { cache: 'no-store' })).text();
  } catch (e) { $('estadoTxt').textContent = 'No se pudo leer el catálogo. Abre el editor con «Abrir editor del catálogo».'; return; }
  huellaBase = huella(htmlBase);
  base = E.leerCatalogo(htmlBase);
  var b = null; try { b = JSON.parse(localStorage.getItem(BORRADOR) || 'null'); } catch (e) { b = null; }
  if (b && b.estado) {
    if (b.huella === huellaBase || confirm('Hay un borrador guardado de una versión anterior del catálogo. ¿Lo recupero?')) estado = b.estado;
  }
  if (!estado) estado = clon(base);
  imagenes = await listarImagenes();
  pintarPanel(); pintarEstado(); ajustarMarco(); refrescarVista(true);
}
async function listarImagenes() {
  var lista = [];
  for (var carpeta of ['/img/', '/img/productos/']) {
    try {
      var t = await (await fetch(carpeta, { cache: 'no-store' })).text();
      (t.match(/href="([^"?#]+\.(?:jpg|jpeg|png|webp))"/gi) || []).forEach(function (m) { var f = decodeURIComponent(m.slice(6, -1)); lista.push('..' + carpeta + f); });
    } catch (e) { }
  }
  return lista.sort();
}

/* ---------- Cambios, historial y borrador ---------- */
function cambio(fn, opc) {
  opc = opc || {};
  historial.push(JSON.stringify(estado)); if (historial.length > 100) historial.shift(); futuro = [];
  fn(estado);
  guardarBorrador(); pintarEstado();
  if (opc.panel) pintarPanel();
  if (!opc.sinVista) refrescarVista();
}
function guardarBorrador() { try { localStorage.setItem(BORRADOR, JSON.stringify({ huella: huellaBase, estado: estado, fecha: Date.now() })); } catch (e) { } }
function pintarEstado() {
  var n = E.resumen(base, E.diferencias(base, estado)).length;
  $('estadoTxt').textContent = n ? n + ' cambio' + (n > 1 ? 's' : '') + ' · borrador guardado en este PC' : 'Sin cambios';
  $('bEnviar').textContent = n ? 'Enviar a Claude (' + n + ')' : 'Enviar a Claude';
  $('bDeshacer').disabled = !historial.length; $('bRehacer').disabled = !futuro.length;
}
$('bDeshacer').onclick = function () { if (!historial.length) return; futuro.push(JSON.stringify(estado)); estado = JSON.parse(historial.pop()); guardarBorrador(); pintarEstado(); pintarPanel(); refrescarVista(); };
$('bRehacer').onclick = function () { if (!futuro.length) return; historial.push(JSON.stringify(estado)); estado = JSON.parse(futuro.pop()); guardarBorrador(); pintarEstado(); pintarPanel(); refrescarVista(); };
document.addEventListener('keydown', function (e) {
  if (!(e.ctrlKey || e.metaKey) || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); $('bDeshacer').click(); }
  if (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey)) { e.preventDefault(); $('bRehacer').click(); }
});

/* ---------- Vista en vivo ---------- */
var tVista = 0;
function refrescarVista(ya) { clearTimeout(tVista); tVista = setTimeout(pintarVista, ya ? 0 : 350); }
function pintarVista() {
  var f = $('frame'), y = 0;
  try { y = f.contentWindow.scrollY || 0; } catch (e) { }
  var html;
  try { html = verAntes ? htmlBase : E.aplicarCambios(htmlBase, E.diferencias(base, estado)); }
  catch (e) { avisar('Error al aplicar: ' + e.message); return; }
  html = html.replace('<head>', '<head><base href="/carta/">');
  f.onload = function () { try { f.contentWindow.scrollTo(0, y); } catch (e) { } prepararSeleccion(); };
  f.srcdoc = html;
  $('etiquetaVista').textContent = verAntes ? 'Antes (publicado)' : 'Con tus cambios';
}
function ajustarMarco() {
  var v = $('vista'), m = $('marco'), dispo = v.clientWidth - 28, alto = v.clientHeight - 28;
  var esc = Math.min(1, dispo / ancho);
  m.style.width = ancho + 'px'; m.style.height = (alto / esc) + 'px';
  m.style.transform = 'translateX(-50%) scale(' + esc + ')';
}
addEventListener('resize', ajustarMarco);
document.querySelectorAll('[data-ancho]').forEach(function (b) {
  b.onclick = function () { ancho = +b.dataset.ancho; document.querySelectorAll('[data-ancho]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); ajustarMarco(); };
});
$('bAntes').onclick = function () { verAntes = !verAntes; this.setAttribute('aria-pressed', String(verAntes)); this.textContent = verAntes ? 'Ver con cambios' : 'Ver antes'; pintarVista(); };

/* ---------- Pestañas ---------- */
document.querySelectorAll('[data-p]').forEach(function (b) {
  b.onclick = function () { pestana = b.dataset.p; document.querySelectorAll('[data-p]').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); }); if (pestana !== 'seleccion') detenerSeleccion(); pintarPanel(); };
});
$('bEnviar').onclick = function () { document.querySelector('[data-p="enviar"]').click(); };

function pintarPanel() {
  var p = $('panel');
  var f = { colores: panelColores, menu: panelMenu, vitrina: panelVitrina, productos: panelProductos, promos: panelPromos, textos: panelTextos, seleccion: panelSeleccion, opciones: panelOpciones, enviar: panelEnviar }[pestana];
  var y = p.scrollTop; p.innerHTML = f(); p.scrollTop = y;
}

/* ---------- Colores ---------- */
function luminancia(hex) {
  var h = hex.replace('#', ''); if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
  var rgb = [0, 2, 4].map(function (i) { var v = parseInt(h.substr(i, 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
}
function contraste(a, b) { var la = luminancia(a), lb = luminancia(b); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); }
function panelColores() {
  var c = estado.colores;
  var pares = [['Texto sobre el fondo', c['--tinta'], c['--masa']], ['Texto sobre las tarjetas', c['--tinta'], c['--tarjeta']], ['Texto secundario sobre tarjetas', c['--suave'], c['--tarjeta']],
    ['Letras blancas sobre el verde', '#ffffff', c['--campo']], ['Letras blancas sobre WhatsApp', '#ffffff', c['--wsp']], ['Naranja de textos sobre el fondo', c['--sol-t'], c['--masa']]];
  return '<h2>Colores de la marca</h2><p class="nota">Los cambios se ven al instante en la vista. Abajo se revisa que el texto se lea bien (contraste mínimo 4,5).</p>'
    + E.COLORES.map(function (x) {
      var v = c[x[0]] || '#000000', cambiado = v !== base.colores[x[0]];
      return '<div class="color"><input type="color" value="' + v + '" data-color="' + x[0] + '" aria-label="' + esc(x[1]) + '"><span>' + esc(x[1]) + (cambiado ? ' <span class="chip">cambiado</span>' : '') + '</span>'
        + '<input type="text" value="' + v + '" data-colortxt="' + x[0] + '" aria-label="Código de ' + esc(x[1]) + '" maxlength="7"><button type="button" class="rest" data-restcolor="' + x[0] + '" title="Volver al original"' + (cambiado ? '' : ' disabled') + '>↺</button></div>';
    }).join('')
    + '<h3>¿Se lee bien?</h3><ul class="contraste">' + pares.map(function (p) { var r = contraste(p[1], p[2]); return '<li><span>' + p[0] + '</span><span class="' + (r >= 4.5 ? 'ok' : 'mal') + '">' + r.toFixed(1).replace('.', ',') + (r >= 4.5 ? ' ✓' : ' ⚠ poco contraste') + '</span></li>'; }).join('') + '</ul>';
}
function colorEnVista(k, v) { try { $('frame').contentDocument.documentElement.style.setProperty(k, v); } catch (e) { } }

/* ---------- Menú y orden ---------- */
function panelMenu() {
  var fams = estado.familias;
  return '<h2>Menú y orden de las secciones</h2><p class="nota">Arrastra las familias (⋮⋮) o usa las flechas. Cada sección se puede subir, bajar o pasar a otra familia.</p>'
    + fams.map(function (f, i) {
      return '<div class="tarjeta" draggable="true" data-arrastra="fam" data-i="' + i + '"><div class="cab-t"><span class="agarre" title="Arrastrar">⋮⋮</span><input class="mini" value="' + esc(f[0]) + '" data-famnombre="' + i + '" aria-label="Nombre de la familia">'
        + '<button type="button" class="ib" data-fam="sube" data-i="' + i + '"' + (i ? '' : ' disabled') + ' aria-label="Subir">↑</button><button type="button" class="ib" data-fam="baja" data-i="' + i + '"' + (i < fams.length - 1 ? '' : ' disabled') + ' aria-label="Bajar">↓</button></div>'
        + '<ul class="secciones">' + f[1].map(function (s, j) {
          return '<li><span>' + esc(s) + '</span><button type="button" class="ib" data-sec="sube" data-i="' + i + '" data-j="' + j + '"' + (j ? '' : ' disabled') + ' aria-label="Subir sección">↑</button><button type="button" class="ib" data-sec="baja" data-i="' + i + '" data-j="' + j + '"' + (j < f[1].length - 1 ? '' : ' disabled') + ' aria-label="Bajar sección">↓</button>'
            + '<select data-mover="' + i + '" data-j="' + j + '" aria-label="Mover a otra familia"><option value="">Mover a…</option>' + fams.map(function (g, k) { return k === i ? '' : '<option value="' + k + '">' + esc(g[0]) + '</option>'; }).join('') + '</select></li>';
        }).join('') + '</ul></div>';
    }).join('');
}

/* ---------- Vitrina ---------- */
function secciones() { var s = [['g-ofertas-y-promos', 'Ofertas y promos']]; estado.familias.forEach(function (f) { f[1].forEach(function (x) { s.push(['g-' + slug(x), x]); }); }); return s; }
function opcionesImg(sel) { return '<option value="">(sin imagen)</option>' + imagenes.map(function (i) { return '<option value="' + esc(i) + '"' + (i === sel ? ' selected' : '') + '>' + esc(i.replace('../img/', '')) + '</option>'; }).join('') + (sel && imagenes.indexOf(sel) < 0 ? '<option selected value="' + esc(sel) + '">' + esc(sel) + '</option>' : ''); }
function panelVitrina() {
  var v = estado.vitrina, secs = secciones();
  return '<h2>Vitrina (carrusel de portada)</h2><p class="nota">Cambia el orden arrastrando (⋮⋮), edita textos y precios, o agrega diapositivas con las fotos de la web.</p>'
    + v.map(function (s, i) {
      var accion = s.wa ? 'wa' : s.ir ? 'ir' : s.avi ? 'avi' : '';
      return '<div class="tarjeta" draggable="true" data-arrastra="vit" data-i="' + i + '"><div class="cab-t"><span class="agarre">⋮⋮</span><b style="flex:1">' + (i + 1) + '. ' + esc(s.tit || s.et || 'Diapositiva') + '</b>'
        + '<button type="button" class="ib" data-vit="sube" data-i="' + i + '"' + (i ? '' : ' disabled') + '>↑</button><button type="button" class="ib" data-vit="baja" data-i="' + i + '"' + (i < v.length - 1 ? '' : ' disabled') + '>↓</button>'
        + '<button type="button" class="ib" data-vit="dup" data-i="' + i + '" title="Duplicar">⧉</button><button type="button" class="ib rojo" data-vit="borra" data-i="' + i + '" title="Eliminar">✕</button></div>'
        + '<div class="vt-mini"><img src="' + esc(rutaImg(s.img)) + '" alt=""><div>'
